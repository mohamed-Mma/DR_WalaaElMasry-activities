<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="1000" height="100" role="img" aria-label="DEVELOPMENT &amp; CREDITS">
<style>.f{font-family:'Arial Black','Archivo Black',Impact,'Helvetica Neue',Arial,sans-serif;font-weight:900}
@keyframes in{from{transform:translateX(-50px);opacity:0}to{transform:none;opacity:1}}
@keyframes st{from{transform:translateX(0)}to{transform:translateX(-48px)}}
@keyframes sh{0%,100%{transform:translate(0,0)}50%{transform:translate(-4px,-4px)}}
.a{animation:in .5s cubic-bezier(.2,1.3,.4,1) both}.s{animation:st .8s linear infinite}.sh{animation:sh 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><clipPath id="c"><rect x="790" y="9" width="186" height="72"/></clipPath></defs>
<g class="a"><rect x="18" y="18" width="976" height="78" fill="#000"/>
<g class="sh"><rect x="6" y="6" width="976" height="78" fill="#B6FF3B" stroke="#000" stroke-width="6"/>
<g clip-path="url(#c)"><g class="s"><polygon points="820,9 844,9 824,81 800,81" fill="#000"/><polygon points="868,9 892,9 872,81 848,81" fill="#000"/><polygon points="916,9 940,9 920,81 896,81" fill="#000"/><polygon points="964,9 988,9 968,81 944,81" fill="#000"/><polygon points="1012,9 1036,9 1016,81 992,81" fill="#000"/><polygon points="1060,9 1084,9 1064,81 1040,81" fill="#000"/><polygon points="1108,9 1132,9 1112,81 1088,81" fill="#000"/><polygon points="1156,9 1180,9 1160,81 1136,81" fill="#000"/></g></g>
<rect x="790" y="6" width="6" height="78" fill="#000"/>
<text class="f" x="30" y="62" font-size="44" textLength="760" lengthAdjust="spacingAndGlyphs" fill="#000">DEVELOPMENT &amp; CREDITS</text></g></g></svg>