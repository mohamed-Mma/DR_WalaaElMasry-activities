<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Signature Lab | Dr. Walaa El-Masry</title>
  <link rel="icon" type="image/webp" href="../assets/images/logo.webp">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <script>(function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)})();</script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow bg-glow-1" aria-hidden="true"></div>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Theme">
    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <div class="game-wrap">
    <div class="game-nav">
      <a href="../index.html">← All activities</a>
      <div class="game-brand"><span>Digital Signature Lab</span><img src="../assets/images/logo.webp" alt=""></div>
      <button type="button" class="share-trigger" id="share-btn" data-share>↗ SHARE</button>
    </div>
    <h1 class="game-title">Sign • Change • Verify</h1>
    <p class="game-desc">Create a digital signature, then change part of the data and watch verification fail.</p>
    <div class="lab-box">
      <h3>① Original message</h3>
      <textarea id="msg" rows="2">Certificate of completion — Programming & AI — Dr. Walaa El-Masry</textarea>
      <button class="btn" onclick="signMsg()">Sign with Private Key</button>
    </div>
    <div class="lab-box">
      <h3>② Digital signature</h3>
      <div id="signature" style="background:var(--bg-main);padding:1rem;border-radius:10px;font-family:'JetBrains Mono',monospace;word-break:break-all;min-height:48px;color:var(--accent-violet);font-size:0.85rem;"></div>
    </div>
    <div class="lab-box">
      <h3>③ Integrity test</h3>
      <p style="color:var(--text-secondary);margin-bottom:0.6rem;font-size:0.9rem;">Change one character in the message and verify.</p>
      <textarea id="msg2" rows="2"></textarea>
      <button class="btn" onclick="verify()">Verify Signature</button>
      <div id="verifyResult"></div>
    </div>
  </div>
  <script>
    document.getElementById('theme-toggle')?.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
    let sig = '';
    function simpleHash(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
      return Math.abs(h).toString(16) + '-WALAA-SIG';
    }
    function signMsg() {
      const original = document.getElementById('msg').value;
      sig = simpleHash(original);
      document.getElementById('signature').textContent = sig;
      document.getElementById('msg2').value = original;
    }
    function verify() {
      const current = document.getElementById('msg2').value;
      const res = document.getElementById('verifyResult');
      if (!sig) { res.innerHTML = '<div class="result error">Sign the message first</div>'; return; }
      if (simpleHash(current) === sig) {
        res.innerHTML = '<div class="result success">Signature valid — message was not altered (Integrity OK)</div>';
      } else {
        res.innerHTML = '<div class="result error">Signature invalid — the message was changed. Digital signatures protect data integrity.</div>';
      }
    }
  </script>
  <script src="../js/share.js"></script>
</body>
</html>
