<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web App Architect | Dr. Walaa El-Masry</title>
  <link rel="icon" type="image/webp" href="../assets/images/logo.webp">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <script>(function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)})();</script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow bg-glow-1" aria-hidden="true"></div>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Theme">
    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <div class="game-wrap">
    <div class="game-nav">
      <a href="../index.html">← All activities</a>
      <div class="game-brand"><span>Web App Architect</span><img src="../assets/images/logo.webp" alt=""></div>
      <button type="button" class="share-trigger" id="share-btn" data-share>↗ SHARE</button>
    </div>
    <h1 class="game-title">Build it. Connect it. Test it.</h1>
    <p class="game-desc">Assign the correct components to Frontend, Backend, and Database.</p>
    <div class="lab-box">
      <h3>App: Interactive lessons platform</h3>
      <p style="margin:1rem 0 0.4rem;"><strong>Frontend needs:</strong></p>
      <label><input type="checkbox" class="fe" value="html"> HTML + CSS + JavaScript</label><br>
      <label><input type="checkbox" class="fe" value="db"> Direct database connection</label><br>
      <label><input type="checkbox" class="fe" value="ui"> Interactive user interface</label>
      <p style="margin:1.1rem 0 0.4rem;"><strong>Backend needs:</strong></p>
      <label><input type="checkbox" class="be" value="logic"> Business logic</label><br>
      <label><input type="checkbox" class="be" value="api"> APIs to receive requests</label><br>
      <label><input type="checkbox" class="be" value="css"> CSS files only</label>
      <p style="margin:1.1rem 0 0.4rem;"><strong>Database needs:</strong></p>
      <label><input type="checkbox" class="db" value="store"> Store student and lesson data</label><br>
      <label><input type="checkbox" class="db" value="query"> Queries</label><br>
      <label><input type="checkbox" class="db" value="design"> UI design</label>
      <button class="btn" style="margin-top:1.1rem;" onclick="checkArch()">Check architecture</button>
      <div id="result"></div>
    </div>
  </div>
  <script>
    document.getElementById('theme-toggle')?.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
    function checkArch() {
      const fe = Array.from(document.querySelectorAll('.fe:checked')).map(c => c.value);
      const be = Array.from(document.querySelectorAll('.be:checked')).map(c => c.value);
      const db = Array.from(document.querySelectorAll('.db:checked')).map(c => c.value);
      const res = document.getElementById('result');
      const feOk = fe.includes('html') && fe.includes('ui') && !fe.includes('db');
      const beOk = be.includes('logic') && be.includes('api') && !be.includes('css');
      const dbOk = db.includes('store') && db.includes('query') && !db.includes('design');
      if (feOk && beOk && dbOk) {
        res.innerHTML = '<div class="result success"><strong>Correct architecture</strong><br>Frontend = UI, Backend = logic + API, Database = storage & queries.</div>';
      } else {
        res.innerHTML = '<div class="result error">Some roles are mixed. Each layer has a clear job.</div>';
      }
    }
  </script>
  <script src="../js/share.js"></script>
</body>
</html>
